<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baza rozwiązań</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = { theme: { extend: { colors: { page: '#f4f7f9' } } } };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  .krok-nr { counter-increment: krok; }
  .krok-nr::before { content: counter(krok); }
  ol.kroki { counter-reset: krok; }
</style>
</head>
<body class="bg-page text-slate-800 min-h-screen">

<!-- Ekran logowania -->
<div id="auth" class="hidden max-w-sm mx-auto px-4 py-16">
  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 space-y-5">
    <div>
      <h1 class="text-2xl font-semibold">Baza rozwiązań</h1>
      <p id="auth-opis" class="text-sm text-slate-500 mt-1">Zaloguj się, aby zobaczyć swoje rozwiązania.</p>
    </div>
    <div id="auth-blad" class="hidden text-sm rounded-lg px-3 py-2 bg-red-50 text-red-700 border border-red-200"></div>
    <div id="auth-info" class="hidden text-sm rounded-lg px-3 py-2 bg-sky-50 text-sky-700 border border-sky-200"></div>
    <div class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="a-email">E-mail</label>
        <input id="a-email" type="email" autocomplete="email" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="a-haslo">Hasło</label>
        <input id="a-haslo" type="password" autocomplete="current-password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
    </div>
    <button id="a-wyslij" class="w-full rounded-lg px-4 py-2 text-sm font-medium bg-blue-600 text-white hover:bg-blue-700">Zaloguj się</button>
    <button id="a-przelacz" class="w-full text-sm text-blue-600 hover:text-blue-700">Nie masz konta? Zarejestruj się</button>
  </div>
</div>

<!-- Aplikacja -->
<div id="app" class="hidden max-w-6xl mx-auto px-4 py-8 space-y-6">
  <header class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold">Baza rozwiązań</h1>
      <p id="u-email" class="text-sm text-slate-500"></p>
    </div>
    <div class="flex gap-2">
      <button id="b-dodaj" class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium bg-blue-600 text-white hover:bg-blue-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        Dodaj rozwiązanie
      </button>
      <button id="b-wyloguj" class="rounded-lg px-4 py-2 text-sm font-medium bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">Wyloguj</button>
    </div>
  </header>

  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 space-y-3">
    <div class="relative">
      <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></svg>
      <input id="szukaj" type="search" placeholder="Szukaj po tytule, maszynie, problemie, krokach, tagach…" class="w-full rounded-lg border border-slate-300 pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
    </div>
    <div id="filtry" class="flex flex-wrap gap-2"></div>
  </div>

  <div id="lista" class="grid gap-4 md:grid-cols-2"></div>
  <div id="pusto" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-8 text-center text-sm text-slate-500"></div>
</div>

<!-- Modal formularza -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 overflow-y-auto">
  <div class="min-h-full flex items-center justify-center p-4">
    <form id="form" class="bg-white border border-slate-200 rounded-xl shadow-sm w-full max-w-xl p-6 space-y-4">
      <h2 id="m-tytul" class="text-lg font-semibold">Nowe rozwiązanie</h2>
      <div id="m-blad" class="hidden text-sm rounded-lg px-3 py-2 bg-red-50 text-red-700 border border-red-200"></div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="f-tytul">Tytuł</label>
        <input id="f-tytul" required maxlength="200" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1" for="f-zakres">Dotyczy</label>
          <select id="f-zakres" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-600">
            <option value="ogolne">Ogólne</option>
            <option value="maszyna">Maszyny</option>
            <option value="grupa">Grupy maszyn</option>
          </select>
        </div>
        <div id="f-cel-box">
          <label class="block text-sm font-medium text-slate-700 mb-1" for="f-cel">Nazwa maszyny / grupy</label>
          <input id="f-cel" maxlength="120" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="f-problem">Opis problemu</label>
        <textarea id="f-problem" rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="f-kroki">Kroki do wykonania (jeden w linii)</label>
        <textarea id="f-kroki" rows="5" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="f-tagi">Tagi (po przecinku)</label>
        <input id="f-tagi" maxlength="200" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" id="m-anuluj" class="rounded-lg px-4 py-2 text-sm font-medium bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">Anuluj</button>
        <button type="submit" id="m-zapisz" class="rounded-lg px-4 py-2 text-sm font-medium bg-blue-600 text-white hover:bg-blue-700">Zapisz</button>
      </div>
    </form>
  </div>
</div>

<script>
// ===== Konfiguracja =====
const SB_URL = 'https://TWOJ-PROJEKT.supabase.co';   // Supabase > Project Settings > API
const SB_KEY = 'TWOJ_ANON_PUBLIC_KEY';               // klucz anon (publiczny), NIE service_role
const TABELA = 'rozwiazania';
const LS_FILTR = 'baza_rozwiazan_filtr';
const ZAKRESY = {
  maszyna: { nazwa: 'Maszyna', klasa: 'bg-sky-50 text-sky-700 border-sky-200' },
  grupa:   { nazwa: 'Grupa',   klasa: 'bg-amber-50 text-amber-700 border-amber-200' },
  ogolne:  { nazwa: 'Ogólne',  klasa: 'bg-slate-100 text-slate-600 border-slate-200' }
};

// ===== Stan =====
const db = supabase.createClient(SB_URL, SB_KEY);
let dane = [];
let filtr = 'wszystkie';
let edytowaneId = null;
let trybRejestracji = false;
const $ = (id) => document.getElementById(id);

// Escapowanie danych użytkownika
function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pokaz(el, tekst) { el.textContent = tekst; el.classList.remove('hidden'); }
function ukryj(el) { el.classList.add('hidden'); }

// ===== Logowanie =====
function ustawTrybAuth() {
  $('a-wyslij').textContent = trybRejestracji ? 'Utwórz konto' : 'Zaloguj się';
  $('a-przelacz').textContent = trybRejestracji ? 'Masz już konto? Zaloguj się' : 'Nie masz konta? Zarejestruj się';
  $('a-haslo').autocomplete = trybRejestracji ? 'new-password' : 'current-password';
  ukryj($('auth-blad')); ukryj($('auth-info'));
}
$('a-przelacz').onclick = () => { trybRejestracji = !trybRejestracji; ustawTrybAuth(); };
$('a-wyslij').onclick = async () => {
  ukryj($('auth-blad')); ukryj($('auth-info'));
  const email = $('a-email').value.trim(), haslo = $('a-haslo').value;
  if (!email || haslo.length < 6) return pokaz($('auth-blad'), 'Podaj e-mail i hasło (min. 6 znaków).');
  $('a-wyslij').disabled = true;
  const { data, error } = trybRejestracji
    ? await db.auth.signUp({ email, password: haslo })
    : await db.auth.signInWithPassword({ email, password: haslo });
  $('a-wyslij').disabled = false;
  if (error) return pokaz($('auth-blad'), 'Nie udało się: ' + error.message);
  if (trybRejestracji && !data.session) pokaz($('auth-info'), 'Konto utworzone. Potwierdź adres e-mail w wiadomości od Supabase, potem się zaloguj.');
};
$('a-haslo').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('a-wyslij').click(); });
$('b-wyloguj').onclick = () => db.auth.signOut();

db.auth.onAuthStateChange((_ev, sesja) => {
  if (sesja) {
    $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
    $('u-email').textContent = sesja.user.email;
    laduj();
  } else {
    dane = []; $('app').classList.add('hidden'); $('auth').classList.remove('hidden');
  }
});

// ===== Dane =====
async function laduj() {
  const { data, error } = await db.from(TABELA).select('*').order('created_at', { ascending: false });
  if (error) { dane = []; pokaz($('pusto'), 'Nie udało się pobrać danych: ' + error.message); return; }
  dane = data;
  rysuj();
}

function rysuj() {
  const q = $('szukaj').value.trim().toLowerCase();
  const wyniki = dane.filter((r) => {
    if (filtr !== 'wszystkie' && r.zakres !== filtr) return false;
    if (!q) return true;
    return [r.tytul, r.cel, r.problem, r.kroki, r.tagi].join(' ').toLowerCase().includes(q);
  });

  // Filtry z licznikami
  const opcje = [['wszystkie', 'Wszystkie'], ['maszyna', 'Maszyny'], ['grupa', 'Grupy'], ['ogolne', 'Ogólne']];
  $('filtry').innerHTML = opcje.map(([k, n]) => {
    const ile = k === 'wszystkie' ? dane.length : dane.filter((r) => r.zakres === k).length;
    const akt = filtr === k ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50';
    return `<button data-filtr="${k}" class="rounded-full border px-3 py-1 text-sm ${akt}">${n} (${ile})</button>`;
  }).join('');

  // Karty
  $('lista').innerHTML = wyniki.map((r) => {
    const z = ZAKRESY[r.zakres] || ZAKRESY.ogolne;
    const kroki = r.kroki.split('\n').map((s) => s.trim()).filter(Boolean);
    const tagi = r.tagi.split(',').map((s) => s.trim()).filter(Boolean);
    return `<article class="bg-white border border-slate-200 rounded-xl shadow-sm p-5 space-y-3">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <h3 class="font-semibold text-slate-900 break-words">${esc(r.tytul)}</h3>
          <div class="flex flex-wrap items-center gap-2 mt-1">
            <span class="rounded-full border px-2 py-0.5 text-xs ${z.klasa}">${z.nazwa}</span>
            ${r.cel ? `<span class="text-sm text-slate-500">${esc(r.cel)}</span>` : ''}
          </div>
        </div>
        <div class="flex gap-1 shrink-0">
          <button data-edytuj="${r.id}" title="Edytuj" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/></svg>
          </button>
          <button data-usun="${r.id}" title="Usuń" class="p-2 rounded-lg text-red-600 hover:bg-red-50">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          </button>
        </div>
      </div>
      ${r.problem ? `<p class="text-sm text-slate-600 whitespace-pre-line">${esc(r.problem)}</p>` : ''}
      ${kroki.length ? `<ol class="kroki space-y-1.5">${kroki.map((s) => `<li class="flex gap-2 text-sm"><span class="krok-nr shrink-0 w-5 h-5 rounded-full bg-blue-50 text-blue-700 text-xs flex items-center justify-center mt-0.5"></span><span class="break-words">${esc(s)}</span></li>`).join('')}</ol>` : ''}
      ${tagi.length ? `<div class="flex flex-wrap gap-1.5">${tagi.map((t) => `<span class="rounded-full bg-slate-100 text-slate-600 px-2 py-0.5 text-xs">#${esc(t)}</span>`).join('')}</div>` : ''}
    </article>`;
  }).join('');

  // Pusty stan
  const pusto = $('pusto');
  if (wyniki.length) ukryj(pusto);
  else pokaz(pusto, dane.length ? 'Brak wyników dla tego wyszukiwania.' : 'Nie masz jeszcze żadnych rozwiązań. Dodaj pierwsze przyciskiem u góry.');
}

// ===== Zdarzenia listy =====
$('szukaj').addEventListener('input', rysuj);
$('filtry').addEventListener('click', (e) => {
  const b = e.target.closest('[data-filtr]'); if (!b) return;
  filtr = b.dataset.filtr;
  try { localStorage.setItem(LS_FILTR, filtr); } catch (_) {}
  rysuj();
});
$('lista').addEventListener('click', async (e) => {
  const ed = e.target.closest('[data-edytuj]'), us = e.target.closest('[data-usun]');
  if (ed) otworzModal(dane.find((r) => r.id === ed.dataset.edytuj));
  if (us && confirm('Usunąć to rozwiązanie? Tej operacji nie można cofnąć.')) {
    const { error } = await db.from(TABELA).delete().eq('id', us.dataset.usun);
    if (error) alert('Nie udało się usunąć: ' + error.message); else laduj();
  }
});

// ===== Modal =====
function ustawCel() { $('f-cel-box').classList.toggle('hidden', $('f-zakres').value === 'ogolne'); }
$('f-zakres').onchange = ustawCel;
function otworzModal(r) {
  edytowaneId = r ? r.id : null;
  $('m-tytul').textContent = r ? 'Edytuj rozwiązanie' : 'Nowe rozwiązanie';
  $('f-tytul').value = r?.tytul || ''; $('f-zakres').value = r?.zakres || 'ogolne';
  $('f-cel').value = r?.cel || ''; $('f-problem').value = r?.problem || '';
  $('f-kroki').value = r?.kroki || ''; $('f-tagi').value = r?.tagi || '';
  ukryj($('m-blad')); ustawCel();
  $('modal').classList.remove('hidden'); $('f-tytul').focus();
}
function zamknijModal() { $('modal').classList.add('hidden'); }
$('b-dodaj').onclick = () => otworzModal(null);
$('m-anuluj').onclick = zamknijModal;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') zamknijModal(); });
$('modal').addEventListener('mousedown', (e) => { if (e.target === $('modal') || e.target.parentElement === $('modal')) zamknijModal(); });

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const zakres = $('f-zakres').value;
  const rekord = {
    tytul: $('f-tytul').value.trim(), zakres,
    cel: zakres === 'ogolne' ? '' : $('f-cel').value.trim(),
    problem: $('f-problem').value.trim(), kroki: $('f-kroki').value.trim(),
    tagi: $('f-tagi').value.trim(), updated_at: new Date().toISOString()
  };
  $('m-zapisz').disabled = true;
  const { error } = edytowaneId
    ? await db.from(TABELA).update(rekord).eq('id', edytowaneId)
    : await db.from(TABELA).insert(rekord);   // user_id uzupełnia baza (auth.uid())
  $('m-zapisz').disabled = false;
  if (error) return pokaz($('m-blad'), 'Nie udało się zapisać: ' + error.message);
  zamknijModal(); laduj();
});

// ===== Start =====
try { filtr = localStorage.getItem(LS_FILTR) || 'wszystkie'; } catch (_) {}
ustawTrybAuth();
</script>
</body>
</html>
