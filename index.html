<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baza rozwiązań</title>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f7f9">
<meta name="apple-mobile-web-app-title" content="Rozwiązania">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.tailwindcss.com/3.4.17?plugins=forms"></script>
<script>
tailwind.config = { theme: { extend: { colors: { page: '#f4f7f9' } } } };
</script>
<script src="https://kamilowebski.github.io/hub/apps.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
ol.kroki { counter-reset: krok; }
.krok-nr { counter-increment: krok; }
.krok-nr::before { content: counter(krok); }
</style>
</head>
<body class="min-h-screen bg-page text-sm text-slate-900 antialiased has-[dialog[open]]:overflow-hidden">

<main class="mx-auto max-w-7xl space-y-6 px-4 py-8">

  <!-- Nagłówek -->
  <header class="flex flex-wrap items-start justify-between gap-4">
    <div class="min-w-0">
      <h1 class="text-2xl font-semibold tracking-tight">Baza rozwiązań</h1>
      <p id="licznik" class="text-sm text-slate-600"></p>
      <p id="userBox" class="mt-1 flex hidden items-center gap-1.5 text-xs text-slate-600"><svg class="h-4 w-4 shrink-0 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span id="u-email" class="min-w-0 truncate"></span></p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <div id="sessionActions" class="flex hidden flex-wrap items-center gap-2">
        <button id="b-dodaj" type="button" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60 border-blue-600 bg-blue-600 text-white shadow-sm hover:border-blue-700 hover:bg-blue-700"><svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Dodaj</button>
        <button id="b-wyloguj" type="button" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60 border-slate-300 bg-white text-slate-900 hover:bg-slate-50" title="Wyloguj"><svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="hidden sm:inline">Wyloguj</span></button>
      </div>
      <div id="hub-apps"></div>
    </div>
  </header>

  <!-- Logowanie (widoczne tylko bez sesji) -->
  <section id="auth" class="mx-auto hidden w-full max-w-md rounded-xl border border-slate-200 bg-white p-4 shadow-sm sm:p-6">
    <h2 class="text-lg font-semibold">Logowanie</h2>
    <p class="mt-1 mb-4 text-sm text-slate-600">Zaloguj się, aby zobaczyć swoje rozwiązania.</p>
    <div id="auth-blad" class="mb-4 hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700" role="alert"></div>
    <div class="mb-4">
      <label class="mb-1.5 block text-[13px] font-medium text-slate-900" for="a-email">E-mail</label>
      <input id="a-email" type="email" autocomplete="email" class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20">
    </div>
    <div class="mb-4">
      <label class="mb-1.5 block text-[13px] font-medium text-slate-900" for="a-haslo">Hasło</label>
      <input id="a-haslo" type="password" autocomplete="current-password" class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20">
    </div>
    <button id="a-wyslij" type="button" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60 border-blue-600 bg-blue-600 text-white shadow-sm hover:border-blue-700 hover:bg-blue-700 w-full">Zaloguj się</button>
  </section>

  <!-- Aplikacja -->
  <div id="app" class="hidden space-y-6">
    <section class="flex flex-col gap-3 rounded-xl border border-slate-200 bg-white p-3 shadow-sm sm:p-4" aria-label="Wyszukiwanie i filtrowanie rozwiązań">
      <div>
        <label class="mb-1.5 block text-[13px] font-medium text-slate-900" for="szukaj">Szukaj</label>
        <input id="szukaj" type="search" autocomplete="off" placeholder="Tytuł, maszyna, problem, kroki, tagi…" class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20">
      </div>
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div id="filtry" class="flex flex-wrap gap-1.5" aria-label="Filtr zakresu"></div>
        <button id="b-zwin" type="button" class="inline-flex items-center gap-2 whitespace-nowrap rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-[13px] font-medium text-slate-900 transition-colors hover:bg-slate-50">Zwiń wszystkie</button>
      </div>
    </section>

    <div id="lista" class="grid items-start gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
    <div id="pusto" class="hidden rounded-xl border border-slate-200 bg-slate-50 p-8 text-center text-sm text-slate-600"></div>
  </div>
</main>

<!-- Modal: rozwiązanie -->
<dialog id="modal" class="m-auto w-[calc(100%-1rem)] max-w-[560px] max-h-[calc(100dvh-1rem)] rounded-2xl border-0 bg-transparent p-0 text-slate-900 backdrop:bg-slate-900/40 sm:w-[calc(100%-2rem)]">
  <form id="form" class="max-h-[calc(100dvh-1rem)] overflow-y-auto overscroll-contain rounded-2xl bg-white p-4 shadow-xl sm:max-h-[calc(100dvh-3rem)] sm:p-6">
    <h2 id="m-tytul" class="mb-5 text-lg font-semibold text-slate-900">Nowe rozwiązanie</h2>
    <div id="m-blad" class="mb-4 hidden rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700" role="alert"></div>
    <div class="mb-4">
      <label class="mb-1.5 block text-[13px] font-medium text-slate-900" for="f-tytul">Tytuł</label>
      <input id="f-tytul" required maxlength="200" class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20">
    </div>
    <div class="flex gap-3 max-sm:flex-col max-sm:gap-0 [&>*]:min-w-0 [&>*]:flex-1">
      <div class="mb-4">
        <label class="mb-1.5 block text-[13px] font-medium text-slate-900" for="f-zakres">Dotyczy</label>
        <select id="f-zakres" class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20 pr-8">
          <option value="ogolne">Ogólne</option>
          <option value="maszyna">Maszyny</option>
          <option value="grupa">Grupy maszyn</option>
        </select>
      </div>
      <div id="f-cel-box" class="mb-4">
        <label class="mb-1.5 block text-[13px] font-medium text-slate-900" for="f-cel">Nazwa maszyny / grupy</label>
        <input id="f-cel" maxlength="120" class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20">
      </div>
    </div>
    <div class="mb-4">
      <label class="mb-1.5 block text-[13px] font-medium text-slate-900" for="f-problem">Opis problemu</label>
      <textarea id="f-problem" rows="3" class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20 resize-y"></textarea>
    </div>
    <div class="mb-4">
      <label class="mb-1.5 block text-[13px] font-medium text-slate-900" for="f-kroki">Kroki do wykonania (jeden w linii)</label>
      <textarea id="f-kroki" rows="6" class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20 resize-y"></textarea>
    </div>
    <div class="mb-4">
      <label class="mb-1.5 block text-[13px] font-medium text-slate-900" for="f-tagi">Tagi (oddzielone przecinkami)</label>
      <input id="f-tagi" maxlength="200" class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-600/20">
    </div>
    <div class="mt-6 flex flex-wrap justify-end gap-2 max-sm:[&>button]:flex-auto">
      <button type="button" id="m-anuluj" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60 border-slate-300 bg-white text-slate-900 hover:bg-slate-50">Anuluj</button>
      <button type="submit" id="m-zapisz" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60 border-blue-600 bg-blue-600 text-white shadow-sm hover:border-blue-700 hover:bg-blue-700">Zapisz</button>
    </div>
  </form>
</dialog>

<!-- Modal: potwierdzenie -->
<dialog id="cfmModal" class="m-auto w-[calc(100%-1rem)] max-w-[400px] max-h-[calc(100dvh-1rem)] rounded-2xl border-0 bg-transparent p-0 text-slate-900 backdrop:bg-slate-900/40 sm:w-[calc(100%-2rem)]">
  <div class="rounded-2xl bg-white p-4 shadow-xl sm:p-6">
    <p id="cfmMsg" class="mb-6 text-sm"></p>
    <div class="flex flex-wrap justify-end gap-2 max-sm:[&>button]:flex-auto">
      <button type="button" id="cfmNo" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60 border-slate-300 bg-white text-slate-900 hover:bg-slate-50">Anuluj</button>
      <button type="button" id="cfmOk" class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60 border-red-600 bg-red-600 text-white hover:brightness-95">Usuń</button>
    </div>
  </div>
</dialog>

<div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-[1000] max-w-[calc(100vw-2rem)] -translate-x-1/2 translate-y-4 rounded-lg bg-slate-900 px-4 py-2.5 text-sm text-white opacity-0 shadow-xl transition" role="status" aria-live="polite"></div>

<script>
// ===== Konfiguracja =====
const SB_URL = 'https://jccbausmoykoqohfuyqw.supabase.co'; // Supabase > Project Settings > API
const SB_KEY = 'sb_publishable_xv8yXGbIiF44_6KjWo8uFg_4Mg4PS8P'; // klucz publishable (publiczny), NIE service_role
const TABELA = 'rozwiazania';
const LS_FILTR = 'baza_rozwiazan_filtr';

// klasy wspólnych komponentów (takie same jak w pozostałych stronach)
const BTN_S = 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60 border-slate-300 bg-white text-slate-900 hover:bg-slate-50';
const BTN_D = 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-60 border-red-600 bg-red-600 text-white hover:brightness-95';
const CHIP = 'inline-flex items-center gap-1 rounded-full border px-3 py-1.5 text-[13px] font-medium transition-colors';
const CHIP_ON = 'border-blue-600 bg-blue-600 text-white hover:bg-blue-700';
const CHIP_OFF = 'border-slate-200 bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900';
const ZAKRESY = {
  maszyna: { nazwa: 'Maszyna', klasa: 'bg-sky-100 text-sky-800' },
  grupa:   { nazwa: 'Grupa',   klasa: 'bg-amber-100 text-amber-800' },
  ogolne:  { nazwa: 'Ogólne',  klasa: 'bg-slate-100 text-slate-600' }
};

// ===== Stan =====
const db = supabase.createClient(SB_URL, SB_KEY);
let dane = [];
let filtr = 'wszystkie';
let edytowaneId = null;
const otwarte = new Set(); // id rozwiniętych kafelków

const $ = (id) => document.getElementById(id);

// Escapowanie danych użytkownika
function esc(t) {
  return String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pokaz(el, tekst) { el.textContent = tekst; el.classList.remove('hidden'); }
function ukryj(el) { el.classList.add('hidden'); }

// Toast (zamiast alert)
let toastT;
function toast(msg, ms = 2500) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('opacity-100', '!translate-y-0');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('opacity-100', '!translate-y-0'), ms);
}

// Okno potwierdzenia (zamiast confirm)
function askConfirm(msg, okLabel = 'OK') {
  const dlg = $('cfmModal');
  $('cfmMsg').textContent = msg;
  $('cfmOk').textContent = okLabel;
  return new Promise((resolve) => {
    let ok = false;
    const onClose = () => { dlg.removeEventListener('close', onClose); resolve(ok); };
    $('cfmOk').onclick = () => { ok = true; dlg.close(); };
    $('cfmNo').onclick = () => dlg.close();
    dlg.addEventListener('close', onClose);
    dlg.showModal();
  });
}
$('cfmModal').addEventListener('click', (e) => { if (e.target === $('cfmModal')) $('cfmModal').close(); });

// ===== Widok: logowanie / aplikacja =====
function setSession(sesja) {
  const on = !!sesja;
  $('auth').classList.toggle('hidden', on);
  $('app').classList.toggle('hidden', !on);
  $('sessionActions').classList.toggle('hidden', !on);
  $('userBox').classList.toggle('hidden', !on);
  $('u-email').textContent = on ? (sesja.user.email || '') : '';
}

// ===== Logowanie (konta zakłada administrator w Supabase) =====
$('a-wyslij').onclick = async () => {
  ukryj($('auth-blad'));
  const email = $('a-email').value.trim(), haslo = $('a-haslo').value;
  if (!email || !haslo) return pokaz($('auth-blad'), 'Podaj e-mail i hasło.');
  $('a-wyslij').disabled = true;
  const { error } = await db.auth.signInWithPassword({ email, password: haslo });
  $('a-wyslij').disabled = false;
  if (error) pokaz($('auth-blad'), 'Nie udało się zalogować: ' + error.message);
};
$('a-haslo').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('a-wyslij').click(); });
$('b-wyloguj').onclick = () => db.auth.signOut();

db.auth.onAuthStateChange((_ev, sesja) => {
  setSession(sesja);
  if (sesja) laduj();
  else { dane = []; $('a-haslo').value = ''; }
});

// ===== Dane =====
async function laduj() {
  const { data, error } = await db.from(TABELA).select('*').order('created_at', { ascending: false });
  if (error) { dane = []; pokaz($('pusto'), 'Nie udało się pobrać danych: ' + error.message); return; }
  dane = data;
  rysuj();
}

function rysuj() {
  const q = $('szukaj').value.trim().toLowerCase();
  const wyniki = dane.filter((r) => {
    if (filtr !== 'wszystkie' && r.zakres !== filtr) return false;
    if (!q) return true;
    return [r.tytul, r.cel, r.problem, r.kroki, r.tagi].join(' ').toLowerCase().includes(q);
  });
  $('licznik').textContent = wyniki.length + ' z ' + dane.length + ' rozwiązań';

  // Filtry z licznikami
  const opcje = [['wszystkie', 'Wszystkie'], ['maszyna', 'Maszyny'], ['grupa', 'Grupy'], ['ogolne', 'Ogólne']];
  $('filtry').innerHTML = opcje.map(([k, n]) => {
    const ile = k === 'wszystkie' ? dane.length : dane.filter((r) => r.zakres === k).length;
    return `<button type="button" data-filtr="${k}" class="${CHIP} ${filtr === k ? CHIP_ON : CHIP_OFF}">${n} ${ile}</button>`;
  }).join('');

  // Rozwijane kafelki
  $('lista').innerHTML = wyniki.map((r) => {
    const z = ZAKRESY[r.zakres] || ZAKRESY.ogolne;
    const kroki = r.kroki.split('\n').map((s) => s.trim()).filter(Boolean);
    const tagi = r.tagi.split(',').map((s) => s.trim()).filter(Boolean);
    const otw = otwarte.has(r.id);
    return `<article class="min-w-0 rounded-xl border border-slate-200 bg-white shadow-sm">
      <button type="button" data-toggle="${r.id}" aria-expanded="${otw}" class="flex w-full items-start justify-between gap-3 rounded-xl p-4 text-left hover:bg-slate-50">
        <div class="min-w-0 space-y-1.5">
          <h3 class="break-words font-semibold text-slate-900">${esc(r.tytul)}</h3>
          <div class="flex flex-wrap items-center gap-2">
            <span class="inline-flex items-center rounded-md px-2 py-1 text-xs font-medium leading-none ${z.klasa}">${z.nazwa}</span>
            ${r.cel ? `<span class="break-words text-sm text-slate-600">${esc(r.cel)}</span>` : ''}
            ${kroki.length ? `<span class="text-xs text-slate-400">${kroki.length} kr.</span>` : ''}
          </div>
        </div>
        <svg class="mt-0.5 h-5 w-5 shrink-0 text-slate-400 transition-transform ${otw ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
      </button>
      ${otw ? `<div class="space-y-4 border-t border-slate-200 p-4">
        ${r.problem ? `<p class="whitespace-pre-line break-words text-sm text-slate-600">${esc(r.problem)}</p>` : ''}
        ${kroki.length ? `<ol class="kroki space-y-2">${kroki.map((s) => `<li class="flex gap-2 text-sm"><span class="krok-nr mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-blue-50 text-xs text-blue-700"></span><span class="min-w-0 break-words">${esc(s)}</span></li>`).join('')}</ol>` : ''}
        ${tagi.length ? `<div class="flex flex-wrap gap-1.5">${tagi.map((t) => `<span class="inline-flex items-center rounded-md bg-slate-200 px-2 py-1 text-[11px] font-medium leading-none text-slate-900">#${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="flex justify-end gap-2">
          <button type="button" data-edytuj="${r.id}" class="${BTN_S}">Edytuj</button>
          <button type="button" data-usun="${r.id}" class="${BTN_D}">Usuń</button>
        </div>
      </div>` : ''}
    </article>`;
  }).join('');

  // Pusty stan
  const pusto = $('pusto');
  if (wyniki.length) ukryj(pusto);
  else pokaz(pusto, dane.length ? 'Brak wyników dla tego wyszukiwania.' : 'Nie masz jeszcze żadnych rozwiązań. Dodaj pierwsze przyciskiem u góry.');
}

// ===== Zdarzenia listy =====
$('szukaj').addEventListener('input', rysuj);
$('b-zwin').onclick = () => { otwarte.clear(); rysuj(); };
$('filtry').addEventListener('click', (e) => {
  const b = e.target.closest('[data-filtr]'); if (!b) return;
  filtr = b.dataset.filtr;
  try { localStorage.setItem(LS_FILTR, filtr); } catch (_) {}
  rysuj();
});
$('lista').addEventListener('click', async (e) => {
  const ed = e.target.closest('[data-edytuj]'), us = e.target.closest('[data-usun]'), tg = e.target.closest('[data-toggle]');
  if (ed) return otworzModal(dane.find((r) => r.id === ed.dataset.edytuj));
  if (us) {
    if (!(await askConfirm('Usunąć to rozwiązanie? Tej operacji nie można cofnąć.', 'Usuń'))) return;
    const { error } = await db.from(TABELA).delete().eq('id', us.dataset.usun);
    if (error) toast('Nie udało się usunąć: ' + error.message, 4000); else { toast('Usunięto'); laduj(); }
    return;
  }
  if (tg) {
    const id = tg.dataset.toggle;
    if (otwarte.has(id)) otwarte.delete(id); else otwarte.add(id);
    rysuj();
  }
});

// ===== Modal =====
function ustawCel() { $('f-cel-box').classList.toggle('hidden', $('f-zakres').value === 'ogolne'); }
$('f-zakres').onchange = ustawCel;

function otworzModal(r) {
  edytowaneId = r ? r.id : null;
  $('m-tytul').textContent = r ? 'Edytuj rozwiązanie' : 'Nowe rozwiązanie';
  $('f-tytul').value = r?.tytul || ''; $('f-zakres').value = r?.zakres || 'ogolne';
  $('f-cel').value = r?.cel || ''; $('f-problem').value = r?.problem || '';
  $('f-kroki').value = r?.kroki || ''; $('f-tagi').value = r?.tagi || '';
  ukryj($('m-blad')); ustawCel();
  $('modal').showModal();
  setTimeout(() => $('f-tytul').focus(), 50);
}
$('b-dodaj').onclick = () => otworzModal(null);
$('m-anuluj').onclick = () => $('modal').close();

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const zakres = $('f-zakres').value;
  const rekord = {
    tytul: $('f-tytul').value.trim(), zakres,
    cel: zakres === 'ogolne' ? '' : $('f-cel').value.trim(),
    problem: $('f-problem').value.trim(), kroki: $('f-kroki').value.trim(),
    tagi: $('f-tagi').value.trim(), updated_at: new Date().toISOString()
  };
  $('m-zapisz').disabled = true;
  const { error } = edytowaneId
    ? await db.from(TABELA).update(rekord).eq('id', edytowaneId)
    : await db.from(TABELA).insert(rekord); // user_id uzupełnia baza (auth.uid())
  $('m-zapisz').disabled = false;
  if (error) return pokaz($('m-blad'), 'Nie udało się zapisać: ' + error.message);
  $('modal').close();
  toast(edytowaneId ? 'Zapisano zmiany' : 'Dodano rozwiązanie');
  laduj();
});

// ===== Start =====
try { filtr = localStorage.getItem(LS_FILTR) || 'wszystkie'; } catch (_) {}
</script>
